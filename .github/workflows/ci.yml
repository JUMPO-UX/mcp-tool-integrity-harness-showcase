name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: python -m pip install ruff==0.8.6 pyyaml==6.0.2
      - name: Ruff (excerpts)
        run: |
          ruff check .
          ruff format --check .
      - name: JSON and YAML are well-formed
        run: |
          python -c "import json,glob; [json.load(open(f)) for f in glob.glob('results/*.json')]"
          python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('detections/*.yml') + glob.glob('.github/workflows/*.yml')]"
